<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEB"/><stop offset="0.33" stop-color="#FFE4E6"/><stop offset="0.66" stop-color="#FAE8FF"/><stop offset="1" stop-color="#DBEAFE"/></linearGradient></defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <text x="92" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E0785C" letter-spacing="3.6">THE PROBLEM</text><text x="92" y="256" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#1A1A1A">Most résumé tools want</text><text x="92" y="322" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#1A1A1A">your <tspan fill="#E0785C">money</tspan>, your <tspan fill="#E0785C">email</tspan>,</text><text x="92" y="388" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#1A1A1A">and your <tspan fill="#E0785C">data</tspan>.</text><text x="92" y="1043" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">“Sign up to continue.” “Upgrade to download.”</text><text x="92" y="1084" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">Meanwhile your résumé - full of personal details -</text><text x="92" y="1125" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">sits on someone else's servers. When you're job-</text><text x="92" y="1166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">hunting under pressure, that's the last thing you need.</text><rect x="92" y="1206" width="896" height="2" fill="#1A1A1A" opacity="0.12"/><text x="92" y="1252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#6E6A66" letter-spacing="2">@ZOLANVARI · CV.ZOLANVARI.COM</text><text x="988" y="1252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#6E6A66" text-anchor="end" letter-spacing="2">02 / 05</text>
</svg>
