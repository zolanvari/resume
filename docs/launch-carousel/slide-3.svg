  <text x="92" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E0785C" letter-spacing="3.6">THE PROJECT · CV.ZOLANVARI.COM</text><text x="92" y="256" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#1A1A1A">A résumé builder that's</text><text x="92" y="322" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#1A1A1A"><tspan fill="#E0785C">free</tspan>, <tspan fill="#E0785C">open source</tspan>,</text><text x="92" y="388" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#1A1A1A">and stores <tspan fill="#E0785C">nothing</tspan>.</text><text x="92" y="1043" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">Upload your old résumé as a <tspan fill="#1A1A1A" font-weight="600">PDF or Word</tspan> file. AI</text><text x="92" y="1084" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">reads it and organises it into clean, structured fields</text><text x="92" y="1125" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">- no account, no fee. It's processed in the moment</text><text x="92" y="1166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">and discarded; nothing is kept unless you opt in.</text><rect x="92" y="1206" width="896" height="2" fill="#1A1A1A" opacity="0.12"/><text x="92" y="1252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#6E6A66" letter-spacing="2">@ZOLANVARI · CV.ZOLANVARI.COM</text><text x="988" y="1252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#6E6A66" text-anchor="end" letter-spacing="2">03 / 05</text>
