  <text x="92" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E0785C" letter-spacing="3.6">WHY WE BUILT IT</text><text x="92" y="256" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" fill="#1A1A1A">Layoffs are everywhere.</text><text x="92" y="330" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" fill="#1A1A1A">Your résumé shouldn't</text><text x="92" y="404" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" fill="#1A1A1A">cost you <tspan fill="#E0785C">anything</tspan>.</text><text x="92" y="1084" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">So we built a résumé builder that's free, open source,</text><text x="92" y="1125" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">and private - and put it online for anyone who needs</text><text x="92" y="1166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#6E6A66">it right now. Here's the why.</text><rect x="92" y="1206" width="896" height="2" fill="#1A1A1A" opacity="0.12"/><text x="92" y="1252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#6E6A66" letter-spacing="2">@ZOLANVARI · CV.ZOLANVARI.COM</text><text x="988" y="1252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#6E6A66" text-anchor="end" letter-spacing="2">01 / 05</text>
</svg>
